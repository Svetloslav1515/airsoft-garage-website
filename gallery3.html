<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storefront Gallery - Airsoft Garage</title>
    <style>
        /* Base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header styles */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            padding-left: 20px;
        }

        .logo img {
            height: 50px;
            margin-right: 15px;
        }

        .logo h1 {
            font-size: 1.8rem;
            color: #3498db;
        }

        /* Navigation */
        nav ul {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 1rem 1.5rem;
            display: block;
            transition: background-color 0.3s;
        }

        nav a:hover {
            background-color: #34495e;
        }

        /* Gallery styles */
        .gallery-header {
            text-align: center;
            padding: 2rem 0;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23333"/><circle cx="50" cy="50" r="40" fill="%239b59b6"/></svg>');
            color: white;
        }

        .gallery-header h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        
        .gallery-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            height: 250px;
            transition: transform 0.3s;
        }
        
        .gallery-item:hover {
            transform: scale(1.05);
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .gallery-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 1rem;
            text-align: center;
            transform: translateY(100%);
            transition: transform 0.3s;
        }
        
        .gallery-item:hover .gallery-overlay {
            transform: translateY(0);
        }

        /* Lightbox Styles */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .lightbox.active {
            display: flex;
            opacity: 1;
        }
        
        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }
        
        .lightbox-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(255,255,255,0.1);
        }
        
        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 30px;
            cursor: pointer;
            background: none;
            border: none;
            transition: transform 0.2s;
        }
        
        .close-btn:hover {
            transform: scale(1.2);
        }

        /* Footer */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 1rem 0;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            nav ul {
                display: none;
            }
            
            .gallery-header h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="./logo.png" alt="Airsoft Garage Logo">
            <h1>Airsoft Garage</h1>
        </div>
        
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./index.html#services">Services</a></li>
                <li><a href="./index.html#about">About</a></li>
                <li><a href="./index.html#gallery">Gallery</a></li>
                <li><a href="./index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Gallery Section -->
    <section class="gallery-header">
        <div class="container">
            <h2>Storefront Gallery</h2>
            <p>Our shop and workspace showcasing airsoft equipment</p>
        </div>
    </section>

    <div class="container">
        <div class="gallery-grid">
            <div class="gallery-item" onclick="openLightbox(0)">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='250' viewBox='0 0 400 250'><rect width='400' height='250' fill='%23333'/><circle cx='200' cy='125' r='80' fill='%239b59b6'/><text x='200' y='125' text-anchor='middle' font-size='24' fill='white' font-family='Arial'>Workspace</text></svg>" alt="Workspace">
                <div class="gallery-overlay">Workspace</div>
            </div>
            
            <div class="gallery-item" onclick="openLightbox(1)">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='250' viewBox='0 0 400 250'><rect width='400' height='250' fill='%23333'/><circle cx='200' cy='125' r='80' fill='%239b59b6'/><text x='200' y='125' text-anchor='middle' font-size='24' fill='white' font-family='Arial'>Equipment</text></svg>" alt="Equipment">
                <div class="gallery-overlay">Equipment</div>
            </div>
            
            <div class="gallery-item" onclick="openLightbox(2)">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='250' viewBox='0 0 400 250'><rect width='400' height='250' fill='%23333'/><circle cx='200' cy='125' r='80' fill='%239b59b6'/><text x='200' y='125' text-anchor='middle' font-size='24' fill='white' font-family='Arial'>Tools</text></svg>" alt="Tools">
                <div class="gallery-overlay">Tools</div>
            </div>
            
            <div class="gallery-item" onclick="openLightbox(3)">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='250' viewBox='0 0 400 250'><rect width='400' height='250' fill='%23333'/><circle cx='200' cy='125' r='80' fill='%239b59b6'/><text x='200' y='125' text-anchor='middle' font-size='24' fill='white' font-family='Arial'>Replica Display</text></svg>" alt="Replica Display">
                <div class="gallery-overlay">Replica Display</div>
            </div>
            
            <div class="gallery-item" onclick="openLightbox(4)">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='250' viewBox='0 0 400 250'><rect width='400' height='250' fill='%23333'/><circle cx='200' cy='125' r='80' fill='%239b59b6'/><text x='200' y='125' text-anchor='middle' font-size='24' fill='white' font-family='Arial'>Shop Interior</text></svg>" alt="Shop Interior">
                <div class="gallery-overlay">Shop Interior</div>
            </div>
            
            <div class="gallery-item" onclick="openLightbox(5)">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='250' viewBox='0 0 400 250'><rect width='400' height='250' fill='%23333'/><circle cx='200' cy='125' r='80' fill='%239b59b6'/><text x='200' y='125' text-anchor='middle' font-size='24' fill='white' font-family='Arial'>Customer Area</text></svg>" alt="Customer Area">
                <div class="gallery-overlay">Customer Area</div>
            </div>
        </div>
    </div>

    <!-- Lightbox for gallery images -->
    <div class="lightbox" id="gallery-lightbox">
        <button class="close-btn" onclick="closeLightbox()">&times;</button>
        <div class="lightbox-content" id="lightbox-content"></div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Airsoft Garage. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Lightbox functionality
        function openLightbox(imageIndex) {
            const lightbox = document.getElementById('gallery-lightbox');
            const lightboxContent = document.getElementById('lightbox-content');
            
            // Create gallery content for storefront images
            const galleryImages = [
                "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400' viewBox='0 0 600 400'><rect width='600' height='400' fill='%23333'/><circle cx='300' cy='200' r='150' fill='%239b59b6'/><text x='300' y='200' text-anchor='middle' font-size='30' fill='white' font-family='Arial'>Workspace Detail</text></svg>",
                "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400' viewBox='0 0 600 400'><rect width='600' height='400' fill='%23333'/><circle cx='300' cy='200' r='150' fill='%239b59b6'/><text x='300' y='200' text-anchor='middle' font-size='30' fill='white' font-family='Arial'>Equipment Setup</text></svg>",
                "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400' viewBox='0 0 600 400'><rect width='600' height='400' fill='%23333'/><circle cx='300' cy='200' r='150' fill='%239b59b6'/><text x='300' y='200' text-anchor='middle' font-size='30' fill='white' font-family='Arial'>Tools Collection</text></svg>",
                "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400' viewBox='0 0 600 400'><rect width='600' height='400' fill='%23333'/><circle cx='300' cy='200' r='150' fill='%239b59b6'/><text x='300' y='200' text-anchor='middle' font-size='30' fill='white' font-family='Arial'>Replica Display</text></svg>",
                "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400' viewBox='0 0 600 400'><rect width='600' height='400' fill='%23333'/><circle cx='300' cy='200' r='150' fill='%239b59b6'/><text x='300' y='200' text-anchor='middle' font-size='30' fill='white' font-family='Arial'>Shop Interior</text></svg>",
                "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400' viewBox='0 0 600 400'><rect width='600' height='400' fill='%23333'/><circle cx='300' cy='200' r='150' fill='%239b59b6'/><text x='300' y='200' text-anchor='middle' font-size='30' fill='white' font-family='Arial'>Customer Area</text></svg>"
            ];
            
            // Display the selected image
            lightboxContent.innerHTML = `<img src="${galleryImages[imageIndex]}" alt="Gallery Image">`;
            lightbox.classList.add('active');
        }
        
        function closeLightbox() {
            const lightbox = document.getElementById('gallery-lightbox');
            lightbox.classList.remove('active');
        }
        
        // Close lightbox when clicking outside
        window.addEventListener('click', function(event) {
            const lightbox = document.getElementById('gallery-lightbox');
            if (event.target === lightbox) {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
